# Apache Iceberg test fixtures (specs/lakehouse/10-testing.md §1, CI-fast tier).
#
#   make lakehouse-up    (from repo root, or run via docker compose -f ... up --wait)
#
# All credentials here are fixture-local fakes (specs/lakehouse/RULES.md §6) —
# never replace them with real cloud credentials; real clouds are exercised
# via OIDC-federated CI runs only.
#
# M0 brings the containers up and documents endpoints; REST/table traffic
# against them starts in M1.

name: pgdatalake

services:
  # Object store: S3-compatible (MinIO) + parity targets Azurite (ADLS Gen2)
  # and fake-gcs-server (GCS), so store-specific code paths (auth, listing
  # semantics, checksum headers) can be exercised in CI-fast from M3 on.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lakehouse-test
      MINIO_ROOT_PASSWORD: lakehouse-test-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Create the fixture bucket and a second access key for tests.
  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 lakehouse-test lakehouse-test-password &&
      mc mb -p local/warehouse &&
      mc admin user add local lakehouse-reader lakehouse-reader-password &&
      echo 'minio fixture ready'
      "

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --loose
    ports:
      - "10000:10000"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  fake-gcs:
    image: fsouza/fake-gcs-server:latest
    command: -scheme http -port 4443 -public-host 127.0.0.1
    ports:
      - "4443:4443"

  # REST catalog (specs/lakehouse/03-catalog.md: REST is primary). Lakekeeper
  # keeps its own metadata in a small postgres instance managed here.
  lakekeeper-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lakekeeper
      POSTGRES_PASSWORD: lakekeeper-password
      POSTGRES_DB: catalog
    volumes:
      - lakekeeper-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lakekeeper -d catalog"]
      interval: 2s
      timeout: 5s
      retries: 30

  lakekeeper-migrate:
    image: lakekeeper/lakekeeper:latest
    command:
      - migrate
      - --runtime-config-postgres-hostname=lakekeeper-db
      - --runtime-config-postgres-port=5432
      - --runtime-config-postgres-user=lakekeeper
      - --runtime-config-postgres-password=lakekeeper-password
      - --runtime-config-postgres-dbname=catalog
      - --runtime-config-postgres-sslmode=disable
    depends_on:
      lakekeeper-db:
        condition: service_healthy

  lakekeeper:
    image: lakekeeper/lakekeeper:latest
    command: serve
    depends_on:
      lakekeeper-db:
        condition: service_healthy
      lakekeeper-migrate:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER__POSTGRES__HOSTNAME: lakekeeper-db
      LAKEKEEPER__POSTGRES__PORT: "5432"
      LAKEKEEPER__POSTGRES__USER: lakekeeper
      LAKEKEEPER__POSTGRES__PASSWORD: lakekeeper-password
      LAKEKEEPER__POSTGRES__DBNAME: catalog
      LAKEKEEPER__POSTGRES__SSLMODE: disable
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8181/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  minio-data:
  lakekeeper-db-data:
