# Trino iceberg connector over the Lakekeeper REST catalog (M1 interop
# gate, specs/lakehouse/10-testing.md §2). Mounted into the trino service
# (docker-compose.yml) as /etc/trino/catalog/iceberg.properties.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=smoke
fs.native-s3.enabled=true
s3.endpoint=http://s3:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=lakehouse-test
s3.aws-secret-key=lakehouse-test-password
# fixture-local fake credentials (RULES §6) — never real cloud keys here
