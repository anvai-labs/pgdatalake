[package]
name = "pgdatalake-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "pgdatalake_core"
# staticlib: linked into the `lakehouse` extension module (specs/lakehouse/01 §2,
# decision D2). rlib: needed for cargo test.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tiny_http = "0.12"
