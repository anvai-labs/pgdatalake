[package]
name = "pgdatalake-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "pgdatalake_core"
# staticlib: linked into the `lakehouse` extension module (specs/lakehouse/01 §2,
# decision D2). rlib: needed for cargo test.
crate-type = ["staticlib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
object_store = { version = "0.11", default-features = false, features = ["aws", "http"] }
bytes = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
apache-avro = { version = "0.17", default-features = false }
parquet = { version = "54", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow = { version = "54", default-features = false }
tokio = { version = "1", default-features = false, features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
roaring = "0.12.0"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
