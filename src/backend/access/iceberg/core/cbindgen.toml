# cbindgen configuration for pgiceberg-core (specs/iceberg/01-architecture.md
# decision D2). The generated header lands in the meson build dir; a checked-in
# stable copy moves to src/include/access/iceberg/iceberg_core.h once the API
# settles (planned M1, doc 01 §2).
language = "C"
no_includes = true
include_guard = "PGICEBERG_CORE_H"

[export]
include = [
    "pgiceberg_core_version",
]
