# Lakehouse CI (specs/lakehouse/10-testing.md §1, CI-fast tier).
# Runs on EVERY branch's pushes that touch lakehouse code (path-filtered, so
# docs-only pushes skip) — feature branches get the real gate, not just
# lakehouse-dev/main. Upstream CI (pg-ci.yml) is untouched; this workflow is
# additive and is the ONLY validity signal for fork code (upstream's
# "CI for PostgreSQL" no-op runs must never be cited as green).
#
# M0 gate (specs/lakehouse/12-roadmap.md): build with -Ddatalake=enabled,
# upstream regress suite green, lakehouse regress green, cargo test green,
# docker fixtures up.
#
# SMART PATH FILTERING (2026-11-21): a `changes` job classifies the diff and
# gates the heavy jobs. The docs sentinel covers spec hygiene. Rust changes
# also build the native binaries that link the Rust library. Workflow changes
# exercise both code jobs and workflow_dispatch forces everything.

name: datalake-ci

on:
  push:
    branches: ['**']
    paths:
      - 'src/backend/access/lakehouse/**'
      - 'src/test/lakehouse/**'
      - 'src/test/regress/lakehouse/**'
      - 'scripts/*shared_sources.py'
      - 'meson.build'
      - 'meson_options.txt'
      - 'src/backend/access/meson.build'
      - 'Makefile'
      - '.github/workflows/datalake-ci.yml'
  pull_request:
    branches: [lakehouse-dev, main]
  workflow_dispatch:

concurrency:
  group: datalake-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with src/backend/access/lakehouse/core/rust-toolchain.toml
  RUST_PIN: '1.100.0'
  CC: /usr/bin/gcc

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      native: ${{ steps.filter.outputs.native }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - name: Check shared source list and guard regression cases
        run: |
          python3 scripts/check_shared_sources.py --check-list
          python3 scripts/check_shared_sources.py --self-test
      - name: Classify changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Rust core: crate sources + manifests/lock (drives fmt/clippy/
            # test/audit AND the backend build, which links the staticlib)
            rust:
              - 'src/backend/access/lakehouse/core/**'
            # Native sources, tests, and build wiring. Use positive patterns:
            # paths-filter's default "some" treats a negation as an OR branch.
            native:
              - 'scripts/*shared_sources.py'
              - 'src/**'
              - 'meson.build'
              - 'meson_options.txt'
              - 'src/backend/access/meson.build'
              - 'Makefile'
            # The workflow itself: run the gates defined in it so a broken
            # step (e.g. an invalid flag) fails its own PR, not the next one
            workflow:
              - '.github/workflows/datalake-ci.yml'

  rust-checks:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain + cbindgen
        run: |
          rustup toolchain install "$RUST_PIN" --profile default \
            -c clippy,rustfmt
          cargo install cbindgen
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Rust checks (pgdatalake-core)
        working-directory: src/backend/access/lakehouse/core
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit (dependency advisories fail the build)
        working-directory: src/backend/access/lakehouse/core
        # vulnerabilities fail the build by default; --deny would ADD
        # classes (warnings/unmaintained/unsound/yanked) — the two
        # "unmaintained" transitive notices (chrono, humantime) stay
        # warnings until upstream offers fixed deps
        run: cargo audit

  build-and-test:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.native == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison flex libreadline-dev zlib1g-dev libxml2-dev \
            libicu-dev libssl-dev libzstd-dev liblz4-dev libnuma-dev \
            pkg-config python3-pip

      - name: Install meson + ninja
        run: pip3 install --user meson ninja
        # keep versions conservative; meson >= 0.57.2 required by meson.build

      - name: Install pinned Rust toolchain + cbindgen
        run: |
          rustup toolchain install "$RUST_PIN" --profile default \
            -c clippy,rustfmt
          cargo install cbindgen
        env:
          RUSTUP_TOOLCHAIN: stable

      - name: Bring up docker fixtures (SeaweedFS S3, Lakekeeper, Azurite, fake-gcs)
        run: make lakehouse-up

      - name: meson setup (-Ddatalake=enabled)
        run: meson setup build -Ddatalake=enabled

      - name: ninja
        run: ninja -C build

      - name: Upstream regress suite (must stay green)
        run: |
          meson test -C build --suite setup
          meson test -C build --suite regress

      - name: Lakehouse regress tests
        run: meson test -C build --suite lakehouse

      - name: Publication claims, COW and lost catalog replies with Trino
        run: |
          docker compose -f src/test/lakehouse/docker-compose.yml -p pgdatalake \
            up --no-deps --wait --wait-timeout 240 trino
          pg_bin="$PWD/build/tmp_install/usr/local/pgsql/bin"
          export PATH="$pg_bin:$PATH"
          export LD_LIBRARY_PATH="$("$pg_bin/pg_config" --libdir)${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PGHOST="$RUNNER_TEMP/cow-smoke" PGPORT=52592 PGUSER=postgres PGDATABASE=postgres
          mkdir -m 700 "$PGHOST"
          initdb -D "$PGHOST/data" -A trust -U "$PGUSER" --no-locale
          pg_ctl -D "$PGHOST/data" -l "$PGHOST/server.log" -o "-k $PGHOST -p $PGPORT -c listen_addresses=''" -w start
          trap 'pg_ctl -D "$PGHOST/data" -m fast -w stop' EXIT
          python3 src/test/lakehouse/fixtures/publication-claim-check.py --live --restart-fixture "$PGHOST/data"
          python3 src/test/lakehouse/fixtures/publication-intent-check.py --restart-fixture "$PGHOST/data"
          python3 src/test/lakehouse/fixtures/managed-capture-binding-check.py --provider --restart-fixture "$PGHOST/data"
          python3 src/test/lakehouse/fixtures/publication-admission-check.py
          sh src/test/lakehouse/fixtures/cow-delete-guard.sh
          python3 src/test/lakehouse/fixtures/catalog-reply-loss-check.py
          COUNT_FORK_SMOKE=1 python3 src/test/lakehouse/fixtures/fdw-count-check.py
          python3 src/test/lakehouse/fixtures/scoped-read-check.py
          rust_target="$PWD/build/src/backend/access/lakehouse/rust-target"
          (
            cd src/backend/access/lakehouse/core
            cargo build --locked --release --target-dir "$rust_target" --example bound_publication_fixture
          )
          python3 src/test/lakehouse/fixtures/bound-publication-restart.py \
            --restart-fixture "$PGHOST/data" --worker "$rust_target/release/examples/bound_publication_fixture" \
            --capture-adapter "$PWD/src/test/lakehouse/fixtures/managed-capture-binding-adapter.sql" \
            --admitted-transport --native-lookup
          python3 src/test/lakehouse/fixtures/publication-discovery-check.py
          python3 src/test/lakehouse/fixtures/publication-ledger-load-check.py
          python3 src/test/lakehouse/fixtures/native-managed-lookup-check.py --restart-fixture "$PGHOST/data"
          python3 src/test/lakehouse/fixtures/native-managed-send-hold-check.py --restart-fixture "$PGHOST/data"
          python3 src/test/lakehouse/fixtures/native-managed-prepare-check.py
          python3 src/test/lakehouse/fixtures/managed-cut-check.py \
            --worker "$rust_target/release/examples/bound_publication_fixture" --expect-runtime-red --native-lookup

      - name: Fetch unmodified PostgreSQL 19.0 for stock package qualification
        uses: actions/checkout@v4
        with:
          repository: postgres/postgres
          ref: 5c839a2a08b9b87a349be97371fac6c5a2873b10
          path: build/stock-pg19-src
          persist-credentials: false

      - name: Build and install the stock PG19 FDW with upstream PGXS
        run: |
          prefix="$RUNNER_TEMP/stock-pg19"
          (
            set -e
            cd build/stock-pg19-src
            ./configure --prefix="$prefix" --without-icu --without-readline --with-ssl=openssl
            make -s -j4
            make -s install
          )
          make -j4 -C src/backend/access/lakehouse/stock PG_CONFIG="$prefix/bin/pg_config" CARGO_TARGET_DIR="$PWD/build/src/backend/access/lakehouse/rust-target"
          make -C src/backend/access/lakehouse/stock PG_CONFIG="$prefix/bin/pg_config" check-shared-sources install

      - name: Stock FDW pins, external position deletes and dump/restore
        run: |
          export PATH="$RUNNER_TEMP/stock-pg19/bin:$PATH"
          export PGHOST="$RUNNER_TEMP/stock-fdw-smoke" PGPORT=52593 PGUSER=postgres PGDATABASE=postgres
          mkdir -m 700 "$PGHOST"
          initdb -D "$PGHOST/data" -A trust -U "$PGUSER" --no-locale
          pg_ctl -D "$PGHOST/data" -l "$PGHOST/server.log" -o "-k $PGHOST -p $PGPORT -c listen_addresses=''" -w start
          trap 'pg_ctl -D "$PGHOST/data" -m fast -w stop' EXIT
          python3 src/test/lakehouse/fixtures/stock-fdw-check.py --receipt "$RUNNER_TEMP/stock-reader.json"
          python3 src/test/lakehouse/fixtures/fdw-count-check.py
          set -o pipefail
          src/test/lakehouse/fixtures/stock-scoped-tls.sh | tee "$RUNNER_TEMP/stock-scoped.log"
          jq -Rsc '[split("\n")[] | fromjson? | objects | del(.mapping_key,.catalog_token)]' \
            "$RUNNER_TEMP/stock-scoped.log" > "$RUNNER_TEMP/stock-scoped-tls.json"

      - name: Collect installed stock package for downstream tests
        run: |
          pg_config="$RUNNER_TEMP/stock-pg19/bin/pg_config"
          dest="$RUNNER_TEMP/stock-reader-test-package"
          mkdir "$dest"
          cp "$("$pg_config" --pkglibdir)/anvai_lake_fdw.so" "$dest/"
          cp "$("$pg_config" --sharedir)/extension/"{lakehouse.control,lakehouse--1.0-fdw.sql} "$dest/"

      - name: Retain stock package for downstream tests
        uses: actions/upload-artifact@v4
        with:
          name: stock-reader-test-package
          path: ${{ runner.temp }}/stock-reader-test-package/
          if-no-files-found: error
          retention-days: 7

      - name: Retain stock reader smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: stock-reader-receipt
          path: |
            ${{ runner.temp }}/stock-reader.json
            ${{ runner.temp }}/stock-scoped-tls.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testlogs
          path: |
            build/meson-logs/
            build/testrun/
          retention-days: 7
