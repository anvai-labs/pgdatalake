# Docs-only sentinel (specs/lakehouse/10-testing.md §1a): datalake-ci is
# path-filtered, so docs-only pushes produce NO checks — which blocks
# required-status-check enforcement. This workflow also checks the versioned
# module contract examples on docs-only pushes.
name: docs-sentinel

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  workflow_dispatch:

jobs:
  sentinel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check shared module contract examples
        run: python3 src/test/lakehouse/test_contract_vectors.py -v
      - name: Check pinned performance receipt rules
        run: python3 -m unittest discover -s scripts/perf -p test_pinned_receipt.py -v
      - name: Check governed-read SQL examples
        run: python3 specs/lakehouse/modules/fixtures/test_governed_read.py -v
